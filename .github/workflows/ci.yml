---
name: CI
'on':
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: "42 1 1 * *"
  workflow_dispatch:

defaults:
  run:
    working-directory: 'ganto.acme_tiny'

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v4
        with:
          path: 'ganto.acme_tiny'

      - name: Set up Python 3.
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install test dependencies.
        run: pip3 install yamllint ansible-lint mdformat

      - name: Install Ansible collections.
        run: ansible-galaxy install -r molecule/docker/collections.yml

      - name: Lint code.
        run: |
          yamllint .
          ansible-lint
          mdformat --check *.md

  molecule:
    name: Molecule
    runs-on: ubuntu-latest

    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v4
        with:
          path: 'ganto.acme_tiny'

      - name: Set up Python 3.
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install test dependencies.
        run: pip3 install -r molecule/docker/requirements.txt

      - name: Run Molecule tests.
        run: molecule test -s docker
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'

  documentation:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v4

      - name: Set up Python 3.
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install documentation dependencies.
        run: pip3 install -r requirements.txt
        working-directory: docs

      - name: Run linkcheck.
        run: make linkcheck
        working-directory: docs

      - name: Build HTML documentation.
        run: make html
        working-directory: docs
